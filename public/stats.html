<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>High Scores · 7 Minute Cardio</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#000;
    --white:#F4F4F4;
    --dim:#5A5A6E;
    --yellow:#FFE14D;
    --red:#FF3B3B;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--white)}
  body{
    font-family:"Press Start 2P",ui-monospace,monospace;
    font-size:11px;line-height:1.6;letter-spacing:.02em;
    padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 28px);
    min-height:100dvh;
    -webkit-font-smoothing:none;
  }
  /* CRT: scanlines + vignette */
  body::after{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:5;
    background:
      repeating-linear-gradient(to bottom,rgba(0,0,0,.28) 0 1px,transparent 1px 3px),
      radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,.55) 100%);
  }
  .screen{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:26px;animation:flicker 6s infinite}
  .glow{text-shadow:0 0 6px currentColor}

  /* top bar, arcade style */
  .topbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:center}
  .topbar .lbl{color:var(--red)}
  .topbar .val{color:var(--white)}

  h1{margin:0;text-align:center;font-weight:400;font-size:12px;color:var(--yellow);line-height:1.8}
  h1 .big{display:block;font-size:24px;margin-top:10px;letter-spacing:.04em}
  h1 .big span{animation:cycle 2.4s steps(1) infinite}
  h2{margin:0 0 12px;font-weight:400;font-size:11px;text-align:center;color:var(--yellow)}

  /* high score table */
  .table{display:flex;flex-direction:column;gap:9px}
  .row{display:grid;grid-template-columns:5ch 8ch 4ch 1fr;gap:1ch;align-items:baseline;white-space:nowrap}
  .row.head{color:var(--white);margin-bottom:4px}
  .row .streak{text-align:right}
  .row.empty{color:var(--dim)!important;text-shadow:none}
  .row.you{animation:blink 1s steps(1) infinite}

  /* stat lines with dot leaders */
  .lines{display:flex;flex-direction:column;gap:9px}
  .line{display:flex;align-items:baseline;gap:6px;white-space:nowrap}
  .line .dots{flex:1;overflow:hidden;color:var(--dim)}
  .line .dots::before{content:"................................................................"}
  .line .v{color:var(--yellow)}
  .note{color:var(--dim);font-size:9px;text-align:right;margin-top:-4px}

  /* where heroes fall */
  .bars{display:flex;flex-direction:column;gap:8px}
  .bar{display:grid;grid-template-columns:11ch 1fr 4ch;gap:1ch;align-items:center;white-space:nowrap}
  .bar .track{height:10px;display:flex}
  .bar .fill{height:100%;background:currentColor;box-shadow:0 0 6px currentColor;min-width:2px}
  .bar .n{text-align:right;color:var(--white)}
  .feared{margin-top:12px;text-align:center;color:var(--red)}

  .you-box{border:2px solid var(--yellow);padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
  .you-box .k{color:var(--dim)}
  .you-box .v{color:var(--yellow)}

  .start{
    display:block;text-align:center;color:var(--yellow);text-decoration:none;
    font-size:14px;padding:16px 0;animation:blink 1.2s steps(1) infinite;
  }
  .start:focus-visible{outline:2px solid var(--yellow);outline-offset:4px}
  .fine{color:var(--dim);font-size:8px;line-height:2;text-align:center}
  .fine a{color:var(--white)}
  .msg{text-align:center;color:var(--white)}
  .blink{animation:blink 1s steps(1) infinite}

  @keyframes blink{50%{opacity:0}}
  @keyframes cycle{
    0%{color:#FF3B3B}16%{color:#FF9F1C}33%{color:#FFE14D}50%{color:#4DFF6A}66%{color:#3BE8FF}83%{color:#C04DFF}
  }
  @keyframes flicker{0%,97%,100%{opacity:1}98%{opacity:.92}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<main class="screen">
  <div class="topbar glow">
    <div><div class="lbl">1UP</div><div class="val" id="oneUp">000000</div></div>
    <div><div class="lbl">HI-SCORE</div><div class="val" id="hiScore">000000</div></div>
  </div>

  <h1 class="glow"><a href="/" style="color:inherit;text-decoration:underline;text-underline-offset:5px">7* MINUTE CARDIO</a><span class="big" id="title">HIGH SCORES</span></h1>

  <section aria-labelledby="hs">
    <div class="table glow" id="table" role="table" aria-label="Top 10 players">
      <div class="row head" role="row"><span>RANK</span><span>SCORE</span><span>NAME</span><span class="streak">DAYS</span></div>
    </div>
    <p class="msg blink" id="status">LOADING...</p>
  </section>

  <section id="youSection" hidden>
    <h2 class="glow">PLAYER 1</h2>
    <div class="you-box glow" id="youBox"></div>
  </section>

  <section>
    <h2 class="glow">WORLD STATS</h2>
    <div class="lines glow" id="world"></div>
  </section>

  <section>
    <h2 class="glow">WHERE HEROES FALL</h2>
    <div class="bars glow" id="bars"></div>
    <div class="feared glow" id="feared"></div>
  </section>

  <a class="start glow" href="/">PRESS START</a>

  <p class="fine">
    100 PTS PER MINUTE. 8 MINUTES PER 7-MINUTE WORKOUT.<br>
    SKIP MORE THAN ONE AND IT DOESN'T COUNT.<br>
    <a href="https://code.pr" target="_blank" rel="noopener">© CODE PR</a>
  </p>
</main>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const COLORS = ['#FF3B3B','#FF9F1C','#FFE14D','#4DFF6A','#3BE8FF','#4D7CFF','#C04DFF','#FF4DC4','#FF9F1C','#4DFF6A'];
  const SHORT = ['BUNNY HOP','BODY SWING','ARM SWING','POPEYE','DEAD ARMS','GOLF TWIST','HIGH 5','SIDE SQUAT'];
  const pad = (n, w = 6) => String(Math.max(0, n | 0)).padStart(w, '0');
  const ord = n => n + (n % 100 >= 11 && n % 100 <= 13 ? 'TH' : ['TH','ST','ND','RD'][n % 10] || 'TH');
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  // Rainbow title letters
  $('title').innerHTML = [...'HIGH SCORES'].map((ch, i) =>
    ch === ' ' ? ' ' : `<span style="animation-delay:${-i * 0.2}s">${ch}</span>`).join('');

  let device = null;
  try { device = localStorage.getItem('7mc-device'); } catch (e) {}
  const d = new Date();
  const day = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;

  function renderTable(top) {
    const t = $('table');
    t.querySelectorAll('.row:not(.head)').forEach(r => r.remove());
    for (let i = 0; i < 10; i++) {
      const p = top[i];
      const row = document.createElement('div');
      row.setAttribute('role', 'row');
      if (p) {
        row.className = 'row' + (p.you ? ' you' : '');
        row.style.color = COLORS[i];
        row.innerHTML = `<span>${ord(i + 1)}</span><span>${pad(p.score)}</span><span>${esc(p.initials)}</span><span class="streak">${p.best_streak}</span>`;
      } else {
        row.className = 'row empty';
        row.innerHTML = `<span>${ord(i + 1)}</span><span>000000</span><span>...</span><span class="streak">-</span>`;
      }
      t.appendChild(row);
    }
  }

  function line(label, value) {
    return `<div class="line"><span>${label}</span><span class="dots" aria-hidden="true"></span><span class="v">${value}</span></div>`;
  }

  function render(s) {
    $('status').hidden = true;
    renderTable(s.top || []);
    $('hiScore').textContent = pad(s.top && s.top[0] ? s.top[0].score : 0);
    $('oneUp').textContent = pad(s.me ? s.me.score : 0);

    const rate = s.starts ? Math.round((s.finishes / s.starts) * 100) + '%' : '--';
    $('world').innerHTML =
      line('WORKOUTS', pad(s.finishes)) +
      line('MINUTES', pad(s.minutes)) +
      `<div class="note">(7 EACH. ALLEGEDLY.)</div>` +
      line('PLAYERS', pad(s.players, 4)) +
      line('TODAY', pad(s.today.finishes, 4)) +
      line('FINISH RATE', rate);

    const q = s.quits || [];
    const max = Math.max(1, ...q);
    $('bars').innerHTML = SHORT.map((name, i) => {
      const n = q[i] || 0;
      return `<div class="bar" style="color:${COLORS[i]}"><span>${name}</span>` +
        `<span class="track"><span class="fill" style="width:${n ? (n / max) * 100 : 0}%"></span></span>` +
        `<span class="n">${n}</span></div>`;
    }).join('');
    const worst = q.length && Math.max(...q) > 0 ? q.indexOf(Math.max(...q)) : -1;
    $('feared').textContent = worst >= 0 ? `MOST FEARED: ${SHORT[worst]}` : 'NOBODY HAS QUIT. YET.';

    if (s.me && s.me.workouts > 0) {
      $('youSection').hidden = false;
      $('youBox').innerHTML =
        `<span class="k">NAME</span><span class="v">${esc(s.me.initials)}</span>` +
        `<span class="k">RANK</span><span class="v">${s.me.rank ? ord(s.me.rank) : '--'}</span>` +
        `<span class="k">WORKOUTS</span><span class="v">${s.me.workouts}</span>` +
        `<span class="k">STREAK</span><span class="v">${s.me.streak} DAY${s.me.streak === 1 ? '' : 'S'}</span>` +
        `<span class="k">BEST</span><span class="v">${s.me.best_streak} DAY${s.me.best_streak === 1 ? '' : 'S'}</span>` +
        `<span class="k">SCORE</span><span class="v">${pad(s.me.score)}</span>`;
    }
    if (!s.top || !s.top.length) {
      $('status').hidden = false;
      $('status').textContent = 'NO SCORES YET. BE THE FIRST.';
    }
  }

  const qs = new URLSearchParams({ day });
  if (device) qs.set('device', device);
  fetch('/api/stats?' + qs, { cache: 'no-store' })
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(render)
    .catch(() => {
      renderTable([]);
      $('status').textContent = 'SCOREBOARD OFFLINE. INSERT COIN.';
      $('world').innerHTML = line('WORKOUTS', '??????');
      $('bars').innerHTML = '';
    });
})();
</script>
</body>
</html>
